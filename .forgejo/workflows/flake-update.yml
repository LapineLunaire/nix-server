name: Update Flake Inputs

# Runs after container-update (01:00 Mondays), so the eval step and the commit it pushes sit on top of its changes for the day.
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch: {}

jobs:
  update:
    runs-on: debian
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install sudo
        run: apt update && apt install -y sudo

      - name: Install Nix
        uses: cachix/install-nix-action@616559265b40713947b9c190a8ff4b507b5df49b # v31

      - name: Update flake inputs
        run: nix flake update

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet flake.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Evaluating both host toplevels (sparkle transitively evaluates every microvm) catches breakage from updated inputs before a host pulls the new lock.
      - name: Eval host toplevels
        if: steps.check.outputs.changed == 'true'
        run: |
          for host in sparkle sparxie; do
            nix eval ".#nixosConfigurations.${host}.config.system.build.toplevel.drvPath"
          done

      # A go, xcaddy or caddy bump changes the vendored tree behind the plugin build's fixed-output hash, which evaluation cannot see. --rebuild is what makes this a check: a fixed-output path already in the store is never rebuilt. The proxy guest carries this derivation on x86_64; sparxie carries the same one on aarch64, which this runner refuses to build.
      - name: Refresh the caddy plugin hash
        if: steps.check.outputs.changed == 'true'
        run: |
          set -o pipefail
          target=".#nixosConfigurations.proxy.config.services.caddy.package.src"
          if err=$(nix build --no-link --rebuild "$target" 2>&1); then
            exit 0
          fi
          got=$(printf '%s\n' "$err" | sed -n 's/^ *got: *\(sha256-[A-Za-z0-9+/=]\{1,\}\).*/\1/p' | head -1)
          if [ -z "$got" ]; then
            printf '%s\n' "$err" >&2
            exit 1
          fi
          old=$(sed -n 's/^ *hash = "\(sha256-[^"]*\)";$/\1/p' modules/nixos/caddy.nix | head -1)
          sed -i "s|\"$old\"|\"$got\"|" modules/nixos/caddy.nix
          echo "caddy plugin hash refreshed: $old -> $got"
          nix build --no-link --rebuild "$target"

      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        uses: ./.forgejo/actions/commit-push
        with:
          paths: flake.lock modules/nixos/caddy.nix
          message: "flake: update inputs"
          ssh-signing-key: ${{ secrets.CI_SIGNING_KEY }}
