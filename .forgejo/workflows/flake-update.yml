name: Update

# Refresh digests before updating the lockfile.
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch: {}

jobs:
  digests:
    runs-on: nixos
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Update digests
        id: digests
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Refresh container images weekly, or on a manual run.
          if [ "$(date +%u)" != "1" ] && [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            echo "not Monday, skipping"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set -euo pipefail
          ha=$(skopeo inspect --format '{{.Digest}}' docker://ghcr.io/home-assistant/home-assistant:stable)

          if [[ ! "$ha" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Invalid container digest: $ha" >&2
            exit 1
          fi

          sed -i "s|home-assistant/home-assistant@sha256:[a-f0-9]*|home-assistant/home-assistant@${ha}|" hosts/sparkle/guests/homeassistant/default.nix

          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check and build
        if: steps.digests.outputs.changed == 'true'
        run: |
          nix flake check --all-systems --no-build --no-write-lock-file --option allow-import-from-derivation false
          nix build --no-link .#nixosConfigurations.sparkle.config.system.build.toplevel

      - name: Commit and push
        if: steps.digests.outputs.changed == 'true'
        uses: ./.forgejo/actions/commit-push
        with:
          paths: |
            hosts/sparkle/guests/homeassistant/default.nix
          message: "sparkle: update container image digests"
          ssh-signing-key: ${{ secrets.CI_SIGNING_KEY }}
          push-token: ${{ github.token }}

  update:
    needs: digests
    runs-on: nixos
    steps:
      # ref rather than the triggering SHA, so this job sees the commit the digests job just pushed.
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - name: Update flake inputs
        run: nix flake update

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet flake.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Rebuild the plugin source to detect stale fixed-output hashes hidden by substitution.
      # Build first because --rebuild requires an existing output.
      - name: Refresh the caddy plugin hash
        if: steps.check.outputs.changed == 'true'
        run: |
          set -euo pipefail
          target=".#nixosConfigurations.proxy.config.services.caddy.package.src"
          err=""
          if out=$(nix build --no-link "$target" 2>&1); then
            if err=$(nix build --no-link --rebuild "$target" 2>&1); then
              exit 0
            fi
          else
            err=$out
          fi
          got=$(printf '%s\n' "$err" | sed -n 's/^ *got: *\(sha256-[A-Za-z0-9+/=]\{1,\}\).*/\1/p' | head -1)
          if [ -z "$got" ]; then
            printf '%s\n' "$err" >&2
            exit 1
          fi
          old=$(sed -n 's/^ *hash = "\(sha256-[^"]*\)";$/\1/p' modules/nixos/caddy.nix | head -1)
          if [[ ! "$old" =~ ^sha256-[A-Za-z0-9+/]{43}=$ ]]; then
            echo "Cannot identify the current Caddy plugin hash" >&2
            exit 1
          fi
          sed -i "s|\"$old\"|\"$got\"|" modules/nixos/caddy.nix
          echo "caddy plugin hash refreshed: $old -> $got"
          nix build --no-link "$target"

      # Evaluate both architectures and reject build-dependent evaluation.
      - name: Check flake outputs
        if: steps.check.outputs.changed == 'true'
        run: nix flake check --all-systems --no-build --no-write-lock-file --option allow-import-from-derivation false

      # Sparkle includes every guest runner. Sparxie is evaluated but not built here.
      - name: Build
        id: build
        if: steps.check.outputs.changed == 'true'
        run: |
          path=$(nix build --no-link --print-out-paths .#nixosConfigurations.sparkle.config.system.build.toplevel)
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Push to the cache
        if: steps.check.outputs.changed == 'true'
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
          STORE_PATH: ${{ steps.build.outputs.path }}
        run: |
          # Cache uploads are optional until the token is configured.
          if [ -z "$ATTIC_TOKEN" ]; then
            echo "ATTIC_TOKEN not set, skipping push"
            exit 0
          fi
          # Attic stores its token in cleartext. Restrict access and remove it on success or failure.
          umask 077
          export XDG_CONFIG_HOME
          XDG_CONFIG_HOME=$(mktemp -d "$RUNNER_TEMP/attic-config.XXXXXX")
          trap 'rm -rf -- "$XDG_CONFIG_HOME"' EXIT
          attic login lunaire https://cache.lunaire.moe/ "$ATTIC_TOKEN"
          unset ATTIC_TOKEN
          attic push lunaire:server "$STORE_PATH"

      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        uses: ./.forgejo/actions/commit-push
        with:
          paths: |
            flake.lock
            modules/nixos/caddy.nix
          message: "flake: update inputs"
          ssh-signing-key: ${{ secrets.CI_SIGNING_KEY }}
          push-token: ${{ github.token }}
