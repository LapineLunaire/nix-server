name: Update

# One daily run. The digest refresh is a job the update depends on rather than an earlier cron, so ordering is a needs: edge and a slow digest job delays the update instead of racing it.
on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch: {}

jobs:
  digests:
    runs-on: nixos
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Update digests
        id: digests
        run: |
          # Weekly, not daily: registry digests move slowly and each change is a guest rebuild.
          # The node image is gone with the container runner: jobs run natively now, so no image is pinned for them.
          if [ "$(date +%u)" != "1" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "not Monday, skipping"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pgadmin=$(skopeo inspect --format '{{.Digest}}' docker://dpage/pgadmin4:latest)
          ha=$(skopeo inspect --format '{{.Digest}}' docker://ghcr.io/home-assistant/home-assistant:stable)

          sed -i "s|dpage/pgadmin4@sha256:[a-f0-9]*|dpage/pgadmin4@${pgadmin}|" hosts/sparkle/guests/pgadmin/default.nix
          sed -i "s|home-assistant/home-assistant@sha256:[a-f0-9]*|home-assistant/home-assistant@${ha}|" hosts/sparkle/guests/homeassistant/default.nix

          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.digests.outputs.changed == 'true'
        uses: ./.forgejo/actions/commit-push
        with:
          paths: hosts/sparkle/guests/pgadmin/default.nix hosts/sparkle/guests/homeassistant/default.nix
          message: "sparkle: update container image digests"
          ssh-signing-key: ${{ secrets.CI_SIGNING_KEY }}

  update:
    needs: digests
    runs-on: nixos
    steps:
      # ref rather than the triggering SHA, so this job sees the commit the digests job just pushed.
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ github.ref_name }}

      - name: Update flake inputs
        run: nix flake update

      - name: Check for changes
        id: check
        run: |
          if git diff --quiet flake.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # A go, xcaddy or caddy bump changes the vendored tree behind the plugin build's fixed-output hash, which evaluation cannot see. The plain build no longer catches it: once a path under the recorded hash is in the cache it substitutes cleanly, so --rebuild re-runs the fetch and compares. It errors when the path was never built, which is why it follows a build rather than replacing it.
      - name: Refresh the caddy plugin hash
        if: steps.check.outputs.changed == 'true'
        run: |
          set -o pipefail
          target=".#nixosConfigurations.proxy.config.services.caddy.package.src"
          err=""
          if out=$(nix build --no-link "$target" 2>&1); then
            if err=$(nix build --no-link --rebuild "$target" 2>&1); then
              exit 0
            fi
          else
            err=$out
          fi
          got=$(printf '%s\n' "$err" | sed -n 's/^ *got: *\(sha256-[A-Za-z0-9+/=]\{1,\}\).*/\1/p' | head -1)
          if [ -z "$got" ]; then
            printf '%s\n' "$err" >&2
            exit 1
          fi
          old=$(sed -n 's/^ *hash = "\(sha256-[^"]*\)";$/\1/p' modules/nixos/caddy.nix | head -1)
          sed -i "s|\"$old\"|\"$got\"|" modules/nixos/caddy.nix
          echo "caddy plugin hash refreshed: $old -> $got"
          nix build --no-link "$target"

      # sparkle's closure references every guest's runner through microvm.vms, so this one target builds all 15 guests and a new registry entry is covered without touching this file. sparxie (aarch64) is skipped: uutils.nix's replaceDependencies needs an IFD that realises its whole closure, which this x86_64 runner can't build.
      - name: Build
        id: build
        if: steps.check.outputs.changed == 'true'
        run: |
          path=$(nix build --no-link --print-out-paths .#nixosConfigurations.sparkle.config.system.build.toplevel)
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Push to the cache
        if: steps.check.outputs.changed == 'true'
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          # The cache isn't deployed yet, so the token secret doesn't exist. Skip cleanly rather than
          # failing the job and blocking the lock commit below; once the secret exists, a real push
          # failure still fails the step normally.
          if [ -z "$ATTIC_TOKEN" ]; then
            echo "ATTIC_TOKEN not set, skipping push"
            exit 0
          fi
          # Scoped to the job: HOME on this runner is persistent, and attic login writes the token
          # there in cleartext.
          export XDG_CONFIG_HOME="$RUNNER_TEMP/attic-config"
          attic login lunaire https://cache.lunaire.moe/ "$ATTIC_TOKEN"
          attic push lunaire:server "${{ steps.build.outputs.path }}"

      - name: Commit and push
        if: steps.check.outputs.changed == 'true'
        uses: ./.forgejo/actions/commit-push
        with:
          paths: flake.lock modules/nixos/caddy.nix
          message: "flake: update inputs"
          ssh-signing-key: ${{ secrets.CI_SIGNING_KEY }}
