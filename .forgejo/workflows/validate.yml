name: Validate

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

jobs:
  validate:
    runs-on: nixos
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Check formatting
        run: nix fmt --no-write-lock-file -- --check .

      - name: Evaluate all systems
        run: nix flake check --all-systems --no-build --no-write-lock-file --option allow-import-from-derivation false
