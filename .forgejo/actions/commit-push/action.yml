name: Commit and push
description: Stage the given paths, commit signed with the repo git identity, and push
inputs:
  paths:
    description: Space-separated paths to stage
    required: true
  message:
    description: Commit message, with the current date appended to it
    required: true
  ssh-signing-key:
    description: Private SSH key used to sign the commit
    required: true
runs:
  using: composite
  steps:
    - name: Commit and push
      shell: bash
      env:
        SSH_SIGNING_KEY: ${{ inputs.ssh-signing-key }}
        PATHS: ${{ inputs.paths }}
        MESSAGE: ${{ inputs.message }}
      run: |
        umask 077
        key="$RUNNER_TEMP/commit-signing-key"
        trap 'rm -f "$key"' EXIT
        printf '%s\n' "$SSH_SIGNING_KEY" > "$key"
        git config user.name "Carmilla"
        git config user.email "carmilla@lunaire.eu"
        git config gpg.format ssh
        git config user.signingkey "$key"
        git config commit.gpgsign true
        git add $PATHS
        git commit -m "$MESSAGE $(date +%Y-%m-%d)"
        git push
